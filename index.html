<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Galaxi Night</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:#000;
    width:100%;
    overflow-x:hidden;
    height:100%;
  }
  body{
    font-family:Arial, Helvetica, sans-serif;
  }
  img{
    display:block;
    width:100%;
    height:auto;
    -webkit-user-drag:none;
    user-select:none;
  }
  a, button{ -webkit-tap-highlight-color:transparent; }

  /* ===================== SCROLL SNAP WRAPPER ===================== */
  .snap-container{
    height:100dvh;
    width:100%;
    overflow-y:scroll;
    overflow-x:hidden;
    scroll-snap-type: y mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }
  .page{
    min-height:100dvh;
    width:100%;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    position:relative;
    overflow:hidden;
  }

  /* Tarjeta tipo celular centrada, nunca se ve "enorme" en pantallas grandes */
  .phone{
    width:100%;
    max-width:430px;
    background:#030005;
    position:relative;
  }

  /* Animación de entrada fluida: cada pantalla aparece con un leve
     deslizamiento + fade al entrar en vista, tanto al bajar como al subir. */
  .phone{
    opacity:0;
    transform:translateY(42px);
    transition: opacity .75s cubic-bezier(.22,.9,.32,1), transform .75s cubic-bezier(.22,.9,.32,1);
    will-change: opacity, transform;
  }
  .page.in-view .phone{
    opacity:1;
    transform:translateY(0);
  }

  /* ===================== HEADER (comun) ===================== */
  .site-header{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 5.6% 5.4% 0 5.4%;
  }
  .site-header .logo{
    width: 38.5%;
    height:auto;
  }
  .site-header .menu-btn{
    background:none;
    border:none;
    padding:0;
    width: 8.8%;
    cursor:pointer;
  }
  .site-header .menu-btn img{ width:100%; }

  .page2 .site-header{
    position:static;
    background:#000;
    padding: 5% 5% 3.6%;
  }
  .page2 .site-header .logo{ width:36%; }
  .page2 .site-header .menu-btn{ width:5.6%; }
  .premios-btn{
    display:block;
    width:30%;
    border:none;
    padding:0;
    background:none;
    cursor:pointer;
    transition: transform .15s ease, filter .15s ease;
  }
  .premios-btn:active{ transform:scale(0.96); }
  .premios-btn:hover{ filter:brightness(1.15); }

  /* ===================== PAGE 1 ===================== */
  .hero-bg{ width:100%; display:block; }

  .info-section{
    background:#000;
    padding: 6% 0 7%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .info-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:88%;
    margin: 0 auto 7%;
  }
  .info-row img{ width:auto; height:auto; display:block; }
  .info-row .fecha{ width:25%; }
  .info-row .ubicacion{ width:32%; }
  .info-row .horario{ width:23%; }
  .info-row .divider{
    width:1px;
    height:34px;
    background: linear-gradient(to bottom, transparent, rgba(160,107,219,0.6), transparent);
  }

  .buy-btn{
    display:block;
    width: 75%;
    text-decoration:none;
    transition: transform .15s ease, filter .15s ease;
  }
  .buy-btn:active{ transform: scale(0.97); }
  .buy-btn:hover{ filter: brightness(1.15); }

  .footer-bg{ width:100%; display:block; margin-top:-1px; }

  /* ===================== PAGE 2 ===================== */
  .scenario-bg{ width:100%; display:block; margin-top:0; }

  .cards-grid{
    background:#000;
    width:100%;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2.2%;
    padding: 4.6% 4.8% 0 4.8%;
  }
  .cards-grid img{
    width:100%;
    height:auto;
    border-radius: 10px;
  }

  .page2-footer{
    width:100%;
    display:block;
    margin-top: 4%;
  }

  .scroll-link{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:22%;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="snap-container" id="snapContainer">

  <!-- ===================== PANTALLA 1 ===================== -->
  <section class="page page1" id="page1">
    <div class="phone">

      <header class="site-header">
        <img class="logo" src="assets/logo_header_transparente.png" alt="Galaxi Night">
        <button class="menu-btn" aria-label="Abrir menú">
          <img src="assets/menu_hamburguesa_transparente.png" alt="">
        </button>
      </header>

      <img class="hero-bg" src="assets/fondo_evento.png" alt="Galaxi Night — Por primera vez en Campeche">

      <div class="info-section">
        <div class="info-row">
          <img class="fecha" src="assets/fecha_transparente.png" alt="Sábado 24 Oct">
          <span class="divider"></span>
          <img class="ubicacion" src="assets/ubicacion_transparente.png" alt="Campeche, Col. Bellavista">
          <span class="divider"></span>
          <img class="horario" src="assets/horario_transparente.png" alt="9:00 PM a 3:00 AM">
        </div>

        <a href="#" class="buy-btn">
          <img src="assets/boton_comprar.png" alt="Comprar boletos">
        </a>
      </div>

      <div style="position:relative;">
        <img class="footer-bg" src="assets/fondo_inferior.png" alt="">
        <div class="scroll-link" data-target="#page2" aria-label="Ir a la siguiente pantalla"></div>
      </div>

    </div>
  </section>

  <!-- ===================== PANTALLA 2 ===================== -->
  <section class="page page2" id="page2">
    <div class="phone">

      <header class="site-header">
        <img class="logo" src="assets/logo_header_transparente.png" alt="Galaxi Night">
        <button class="premios-btn" aria-label="Ver premios">
          <img src="assets/boton_ver_premios.png" alt="Ver premios">
        </button>
        <button class="menu-btn" aria-label="Abrir menú">
          <img src="assets/menu_hamburguesa_transparente.png" alt="">
        </button>
      </header>

      <img class="scenario-bg" src="assets/fondo_escenario.png" alt="Mucho más que música">

      <div class="cards-grid">
        <img src="assets/card_dj_en_vivo.png" alt="DJ en vivo — Música que te lleva a otra dimensión">
        <img src="assets/card_concurso_disfraces.png" alt="Concurso de disfraces — Demuestra tu creatividad">
        <img src="assets/card_bebidas_especiales.png" alt="Bebidas especiales — Tragos únicos para la noche">
        <img src="assets/card_sonido_profesional.png" alt="Sonido profesional — Una experiencia de alto nivel">
        <img src="assets/card_dinamicas_sorpresas.png" alt="Dinámicas y sorpresas — Actividades durante toda la noche">
        <img src="assets/card_ambientacion_tematica.png" alt="Ambientación temática — Vive el espíritu de Halloween">
      </div>

      <img class="page2-footer" src="assets/fondo_inferior2.png" alt="Comprar boletos">

    </div>
  </section>

</div>

<script>
(function(){
  var pages = document.querySelectorAll('.page');
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting && entry.intersectionRatio > 0.55){
        entry.target.classList.add('in-view');
      } else {
        entry.target.classList.remove('in-view');
      }
    });
  }, { threshold: [0, 0.55, 1] });
  pages.forEach(function(p){ observer.observe(p); });

  // Flechas / zonas de "desliza hacia abajo" navegan a la siguiente pantalla
  document.querySelectorAll('[data-target]').forEach(function(el){
    el.addEventListener('click', function(){
      var target = document.querySelector(el.getAttribute('data-target'));
      if(target){ target.scrollIntoView({behavior:'smooth'}); }
    });
  });
})();
</script>

</body>
</html>
